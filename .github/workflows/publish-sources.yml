name: Build and publish sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sources/**'
      - 'sdk/**'
      - 'bundle.json'
      - 'build.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/publish-sources.yml'

permissions:
  contents: write

concurrency:
  group: publisher-sources
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install source build tools
        run: sdkmanager 'build-tools;36.0.0' 'platforms;android-34'
      - name: Verify and build source extension
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test publishSources
      - name: Commit generated publisher artefacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json releases/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified source extension'
            git push origin HEAD:main
          fi
